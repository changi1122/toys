[project]
name = "kbo-crawler"
version = "0.1.0"
description = "KBO baseball team batting stats crawler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
